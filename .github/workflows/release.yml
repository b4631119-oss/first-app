name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 1.0.5)"
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  RUNTIME_IDENTIFIER: "win-x64"

jobs:
  windows-release:
    name: Windows Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Get version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Building version: $version"

      - name: Restore dependencies
        run: dotnet restore MyFirstApp.csproj

      - name: Build
        run: dotnet build MyFirstApp.csproj -c Release --no-restore

      - name: Publish Windows
        run: >
          dotnet publish MyFirstApp.csproj
          -c Release
          -r ${{ env.RUNTIME_IDENTIFIER }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          -o publish/${{ env.RUNTIME_IDENTIFIER }}

      - name: Verify publish output
        shell: pwsh
        run: |
          $publishDir = "publish/${{ env.RUNTIME_IDENTIFIER }}"
          $exe = Join-Path $publishDir "MyFirstApp.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Executable not found at $exe"
            exit 1
          }
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          Write-Host "Published EXE FileVersion: $($versionInfo.FileVersion)"
          Write-Host "Published EXE ProductVersion: $($versionInfo.ProductVersion)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress --version 6.2.2

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            installer.iss

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = "MyFirstApp-Setup-${{ steps.version.outputs.version }}.exe"
          if (-not (Test-Path $installer)) {
            Write-Error "Installer not found at $installer"
            exit 1
          }
          $sha256 = Get-FileHash -Algorithm SHA256 $installer
          Write-Host "Installer SHA256: $($sha256.Hash)"
          "INSTALLER_SHA256=$($sha256.Hash)" >> $env:GITHUB_ENV

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.version.outputs.version }}
          path: MyFirstApp-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: My First App v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            MyFirstApp-Setup-${{ steps.version.outputs.version }}.exe
          body: |
            ## My First App v${{ steps.version.outputs.version }}

            ### Installer
            - **File:** `MyFirstApp-Setup-${{ steps.version.outputs.version }}.exe`
            - **SHA-256:** ${{ env.INSTALLER_SHA256 }}

            ### Installation
            1. Download the installer
            2. Verify SHA-256: `${{ env.INSTALLER_SHA256 }}`
            3. Run as Administrator
            4. Follow the installation wizard

            ### Auto-Update
            If you have a previous version installed, the app will automatically detect and prompt for this update.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}